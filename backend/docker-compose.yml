services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bullwave
      POSTGRES_PASSWORD: bullwave
      POSTGRES_DB: bullwave
    ports:
      - "5432:5432"
    volumes:
      - bullwave_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bullwave_pg:
